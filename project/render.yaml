# Render deployment manifest for Bolt frontend (static site)
# Place this at the repository root. Update secrets/values in Render dashboard.

services:
  - type: web_service
    name: bolt-frontend
    branch: main
    # Build from repository root: change to project folder, install and build
    buildCommand: cd project && npm ci && npm run build
    # Start command: run Vite preview server binding to the Render-assigned PORT
    startCommand: cd project && npm ci && npm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: VITE_SUPABASE_URL
        value: "<YOUR_SUPABASE_URL>"
      - key: VITE_SUPABASE_ANON_KEY
        value: "<YOUR_SUPABASE_ANON_KEY>"
    # Secrets (set these in Render dashboard as protected secrets)
    secrets:
      - key: SUPABASE_SERVICE_ROLE
        value: "<YOUR_SERVICE_ROLE_KEY>"

# Notes:
# - Replace placeholder values above with your actual Supabase project URL and anon key, or set them
#   in Render's Environment → Secrets (recommended for sensitive values).
# - After pushing this file, connect the repository in Render and create the static site using this
#   manifest. Render will pick up the settings and deploy automatically.